name: Build Auto-Updating Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies & build dist
        run: |
          npm ci
          npm run build

      - name: Setup Java 17 & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Capacitor / WebView Shell
        run: |
          mkdir -p android-apk-build
          cd android-apk-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MU Lorencia Offline" "com.mulorencia.offline" --web-dir="../dist"
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android-apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mu-lorencia-offline-apk
          path: android-apk-build/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MU Lorencia Offline APK v1.0.${{ github.run_number }}
          files: android-apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
